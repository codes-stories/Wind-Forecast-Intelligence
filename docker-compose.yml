# Local development stack: backend (FastAPI) + frontend (nginx SPA + API proxy)
services:
  backend:
    build: ./backend
    image: wind-forecast-backend:local
    ports:
      - "8000:8000"
    environment:
      # Origins allowed to call the API directly (CORS). Same-origin traffic
      # through the nginx proxy does not need these.
      ALLOWED_ORIGINS: http://localhost:8081,http://localhost:5173,http://127.0.0.1:8081
      DECISION_CUTOFF_HHMM: "09:20"
      CACHE_TTL_SECONDS: "3600"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        # "" = same-origin; the nginx proxy in this container reaches the
        # backend at $BACKEND_URL below. Override for non-proxy deploys.
        VITE_API_BASE: ""
    image: wind-forecast-frontend:local
    ports:
      - "8081:80"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
