<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f766e'/%3E%3Cpath d='M16 24V14m0 0-6-4m6 4 6-4' stroke='white' stroke-width='2.4' stroke-linecap='round' fill='none'/%3E%3Ccircle cx='16' cy='9.5' r='2.6' fill='white'/%3E%3C/svg%3E"
    />
    <title>Wind Forecast Intelligence — January 2026</title>
    <meta
      name="description"
      content="Retrospective day-ahead UK wind generation forecast vs outturn analysis for January 2026. Source: Elexon BMRS."
    />
    <script>
      // Apply the stored/system theme before first paint (no flash).
      // Mirrors initialTheme() in src/theme.tsx: ?theme= → localStorage → OS.
      (function () {
        try {
          var t = new URLSearchParams(location.search).get("theme");
          if (t !== "dark" && t !== "light") t = localStorage.getItem("wfi-theme");
          if (t !== "dark" && t !== "light")
            t =
              window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.classList.toggle("dark", t === "dark");
        } catch (e) {
          /* keep default light theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
