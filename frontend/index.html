<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wind Forecast Intelligence — January 2026</title>
    <meta
      name="description"
      content="Retrospective day-ahead UK wind generation forecast vs outturn analysis for January 2026. Source: Elexon BMRS."
    />
    <script>
      // Apply the stored/system theme before first paint (no flash).
      // Mirrors initialTheme() in src/theme.tsx: ?theme= → localStorage → OS.
      (function () {
        try {
          var t = new URLSearchParams(location.search).get("theme");
          if (t !== "dark" && t !== "light") t = localStorage.getItem("wfi-theme");
          if (t !== "dark" && t !== "light")
            t =
              window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.classList.toggle("dark", t === "dark");
        } catch (e) {
          /* keep default light theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
